name: Go 1.27

on:
  push:
    paths:
      - "*.go"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "**/go.mod"
      - "**/go.sum"
      - "vendor/**"
      - "gx/**"
      - "scripts/go.sh"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "*.go"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "**/go.mod"
      - "**/go.sum"
      - "vendor/**"
      - "gx/**"
      - "scripts/go.sh"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: false
      - name: Compile all packages
        run: ./scripts/go.sh test -vet=off ./... -run '^$' -count=1
      - name: Test social runtime boundaries
        run: ./scripts/go.sh test -vet=off ./api ./net/service ./net/retriever ./core ./cmd ./ipfs ./schema -run 'TestSocialOnly|^$' -count=1
      - name: Test maintained P2P core
        working-directory: modern
        run: go test ./... -count=1
